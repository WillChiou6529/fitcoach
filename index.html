<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff6b35">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- 直接雙擊開檔（file://）時瀏覽器不准讀 manifest，只在網頁版加上 -->
  <script>if (location.protocol !== 'file:') document.write('<link rel="manifest" href="manifest.webmanifest">');</script>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>減肥啦幹</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="logo">🔥</span><div><b>減肥啦幹</b><small>你的減脂教練</small></div></div>
    <nav id="nav">
      <button data-page="home" class="active"><span>🏠</span>今日總覽</button>
      <button data-page="body"><span>📊</span>身體數據</button>
      <button data-page="diet"><span>🍱</span>飲食紀錄</button>
      <button data-page="train"><span>🏋️</span>訓練菜單</button>
      <button data-page="sleep"><span>🌙</span>作息規劃</button>
      <button data-page="settings"><span>⚙️</span>資料管理</button>
    </nav>
    <div class="side-foot">
      <button id="tourBtn" class="ghost small">❓ 新手教學</button>
      <button id="themeBtn" class="ghost small">🌓 切換深淺色</button>
      <p class="muted tiny">資料只存在這台電腦的瀏覽器裡。<br>計算結果僅供參考，不取代醫師與營養師建議。</p>
    </div>
  </aside>

  <main>
    <section id="page-home" class="page active"></section>
    <section id="page-body" class="page"></section>
    <section id="page-diet" class="page"></section>
    <section id="page-train" class="page"></section>
    <section id="page-sleep" class="page"></section>
    <section id="page-settings" class="page"></section>
  </main>

  <div id="timer" class="timer hidden">
    <div class="timer-label">組間休息</div>
    <div class="timer-time" id="timerTime">00:00</div>
    <div class="timer-btns"><button id="timerAdd" class="ghost small">+30 秒</button><button id="timerStop" class="small">結束</button></div>
  </div>
  <div id="toast" class="toast"></div>

  <script src="data/foods.js"></script>
  <script src="data/supplements.js"></script>
  <script src="data/foods_cvs.js"></script>
  <script src="data/foods_breakfast.js"></script>
  <script src="data/foods_veg.js"></script>
  <script src="data/foods_nightmarket.js"></script>
  <script src="data/swaps.js"></script>
  <script src="data/workouts_a.js"></script>
  <script src="data/workouts_b.js"></script>
  <script src="data/stretch.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/store.js"></script>
  <script src="js/body.js"></script>
  <script src="js/myfoods.js"></script>
  <script src="js/diet.js"></script>
  <script src="js/train.js"></script>
  <script src="js/sleep.js"></script>
  <script src="js/lift.js"></script>
  <script src="js/swap.js"></script>
  <script src="js/balance.js"></script>
  <script src="js/tour.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
